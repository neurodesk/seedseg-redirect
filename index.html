<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SeedSeg has moved</title>
<link rel="canonical" href="https://webapps.neurodesk.org/seedseg/">
<meta http-equiv="refresh" content="0; url=https://webapps.neurodesk.org/seedseg/">
<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((registrations) => registrations.forEach((registration) => registration.unregister()));
location.replace('https://webapps.neurodesk.org/seedseg/' + location.search + location.hash);
</script>
</head>
<body>
<p>SeedSeg has moved to <a href="https://webapps.neurodesk.org/seedseg/">webapps.neurodesk.org/seedseg</a>.</p>
</body>
</html>
